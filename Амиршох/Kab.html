<!DOCTYPE html>

<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>FutureWork — Личный кабинет</title>

<link rel="stylesheet" href="Kab.css">


</head>

<body>


<div class="background-glow glow-1"></div>
<div class="background-glow glow-2"></div>

<header class="header">

    <div class="container nav-container">

        <a href="index.html" class="logo">

            <span class="logo-icon">
                F
            </span>

            <span>
                Future<span>Work</span>
            </span>

        </a>

        <div class="nav-buttons">

            <button
                type="button"
                class="nav-register"
                id="logout-button"
            >
                Выйти
            </button>

        </div>

    </div>

</header>


<main>

    <section class="cabinet-section">

        <div class="cabinet-card">

            <div class="cabinet-header">

                <div class="login-icon">
                    F
                </div>

                <div>
                    <h1 id="welcome-name">
                        Добро пожаловать!
                    </h1>

                    <p>
                        Твой личный кабинет FutureWork
                    </p>
                </div>

            </div>


            <div class="profile-grid">

                <div class="profile-item">
                    <span>Имя</span>
                    <strong id="user-name">—</strong>
                </div>

                <div class="profile-item">
                    <span>Псевдоним</span>
                    <strong id="user-nickname">—</strong>
                </div>

                <div class="profile-item">
                    <span>Email</span>
                    <strong id="user-email">—</strong>
                </div>

                <div class="profile-item">
                    <span>Телефон</span>
                    <strong id="user-phone">—</strong>
                </div>

                <div class="profile-item">
                    <span>Возраст</span>
                    <strong id="user-age">—</strong>
                </div>

                <div class="profile-item">
                    <span>Город</span>
                    <strong id="user-city">—</strong>
                </div>

                <div class="profile-item">
                    <span>Опыт</span>
                    <strong id="user-experience">—</strong>
                </div>

            </div>


            <div class="cabinet-actions">

                <a
                    href="index.html#register"
                    class="cabinet-button"
                >
                    Вернуться на главную
                </a>

            </div>

        </div>

    </section>

</main>


<footer class="footer">

    <p>
        © 2026 FutureWork.
        Создаём будущее вместе.
    </p>

</footer>











<script src="Kab.js"></script>


</body>

</html>
